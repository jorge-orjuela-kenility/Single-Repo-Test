name: Release

on:
  workflow_dispatch:
    inputs:
      cut:
        description: "Release type"
        type: choice
        options: [rc, prod]
        required: false

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'workflow_dispatch')
    runs-on: macos-15

    env:
      LBL_RC: cut-rc      
      GH_TOKEN: ${{ secrets.GH_EXTERNAL_PAT }}
      SPM_CLONE_DIR: ${{ github.workspace }}/.spm-checkouts

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git identity
        shell: bash
        run: |
          set -euo pipefail

          git config user.name  "truvideo[bot]"
          git config user.email "truvideo[bot]@users.noreply.github.com"

      - name: Install tooling
        run: |
          brew install jq xcodegen cocoapods || true
          python3 -m venv .venv

          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install gdown

          .venv/bin/gdown --version

      
      - name: Zip frameworks artifacts
        shell: bash
        run: |
          set -Eeuo pipefail

          XCROOT="DerivedData/XCFrameworks"

          if [ ! -d "$XCROOT" ]; then
            echo "ERROR: Missing xcframework output folder: $XCROOT" >&2
            exit 1
          fi

          rm -rf dist
          mkdir -p dist

          found_any=false

          for fw in "$XCROOT"/*.xcframework; do
            [ -d "$fw" ] || continue
            found_any=true

            name="$(basename "$fw" .xcframework)"
            zip_path="dist/${name}.xcframework.zip"

            echo "Zipping ${name}.xcframework -> $zip_path"

            (
              cd "$XCROOT"
              /usr/bin/zip -qry "$GITHUB_WORKSPACE/$zip_path" "${name}.xcframework"
            )
          done

          if [ "$found_any" = false ]; then
            echo "ERROR: No xcframeworks found in $XCROOT" >&2
            exit 1
          fi

          echo "== dist outputs =="
          ls -la dist
          find dist -maxdepth 1 -type f -name "*.xcframework.zip" -print

      - name: Build CocoaPods artifact
        shell: bash
        env:
          COCOAPODS_UTILS_LINK: ${{ secrets.COCOAPODS_UTILS_LINK }}
        run: |
          set -Eeuo pipefail
          chmod +x scripts/build_cocoapods_artifact.sh
          scripts/build_cocoapods_artifact.sh
      
      - name: Create tag
        env:
          VERSION_FULL: ${{ steps.version.outputs.full }}
        run: |
          set -Eeuo pipefail

          TAG="${VERSION_FULL:?VERSION_FULL not set}"          

          git fetch --tags

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG"
            exit 1
          fi

          git config user.name "kenility-bot"
          git config user.email "bot@kenility.com"

          git tag -a "$TAG" -m "chore(release): internal ${VERSION_FULL}"
          git push origin "$TAG"

      - name: Publish SPM repo
        env:
          VERSION_FULL: ${{ steps.version.outputs.full }}
          GH_EXTERNAL_PAT: ${{ secrets.GH_EXTERNAL_PAT }}
          gh release create: ${{ secrets.GH_EXTERNAL_PAT }}
          REMOTE_REPO: Truvideo/truvideo-sdk-ios-core 
          REMOTE_BRANCH: main
        run: |
          set -Eeuo pipefail

          : "${VERSION_FULL:?VERSION_FULL not set}"
          : "${GH_TOKEN:?GH_TOKEN not set}"
          
          rm -rf spm-repo
          git clone "https://x-access-token:${GH_EXTERNAL_PAT}@github.com/Truvideo/truvideo-sdk-ios-core.git" "$GITHUB_WORKSPACE/spm-repo"
          cd spm-repo
          git checkout "${REMOTE_BRANCH}"
          
          set -Eeuo pipefail
          set -x

          ROOT="$GITHUB_WORKSPACE"
          
          echo "PWD=$(pwd)"
          echo "ROOT=$ROOT"
          ls -la "$ROOT" || true
          ls -la "$ROOT/scripts" || true
          ls -la "$ROOT/spm-repo" || true
          command -v gh || true
          command -v swift || true
          command -v python3 || true
          command -v zip || true

          chmod +x "$ROOT/scripts/release_checksums.sh"
          "$ROOT/scripts/release_checksums.sh" --dir "$ROOT/dist" --out "$ROOT/checksums.json"

          chmod +x "$ROOT/scripts/release_update_package.sh"
          "$ROOT/scripts/release_update_package.sh" \
            --repo-dir "$ROOT/spm-repo" \
            --version "$VERSION_FULL" \
            --checksums "$ROOT/checksums.json" \
            --download-base "https://github.com/Truvideo/truvideo-sdk-ios-core/releases/download"

          chmod +x "$ROOT/scripts/release_update_podspec.sh"
          "$ROOT/scripts/release_update_podspec.sh" \
            --repo-dir "$ROOT/spm-repo" \
            --version "$VERSION_FULL" \
            --podspec-name "truvideo-sdk-core.podspec" \
            --asset-name "TruvideoSdk.zip" \
            --download-base "https://github.com/Truvideo/truvideo-sdk-ios-core/releases/download"

          chmod +x "$ROOT/scripts/release_commit_tag_push.sh"
          "$ROOT/scripts/release_commit_tag_push.sh" \
            --repo-dir "$ROOT/spm-repo" \
            --version "$VERSION_FULL" \
            --branch "$REMOTE_BRANCH"            

           PRERELEASE_FLAG=""

          if [ -f "$GITHUB_WORKSPACE/.cut_release_scope" ]; then
            source "$GITHUB_WORKSPACE/.cut_release_scope"
          fi

          CUT_FINAL="${CUT:-rc}"
          if [[ "$CUT_FINAL" == "rc" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          echo "CUT=$CUT_FINAL → PRERELEASE_FLAG=$PRERELEASE_FLAG"

          chmod +x "$ROOT/scripts/release_create_release.sh"
          "$ROOT/scripts/release_create_release.sh" \
            --repo "$REMOTE_REPO" \
            --version "$VERSION_FULL" \
            --notes-file "$ROOT/CHANGELOG.md" \
            --assets-glob "$ROOT/dist/*.xcframework.zip" \
            --assets-glob "$ROOT/dist/TruvideoSdk.zip" \
            $PRERELEASE_FLAG

      - name: Configure CocoaPods trunk token
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
          COCOAPODS_TRUNK_EMAIL: ${{ secrets.COCOAPODS_TRUNK_EMAIL }}
        run: |
          set -Eeuo pipefail

          if [ -z "${COCOAPODS_TRUNK_TOKEN:-}" ]; then
            echo "Missing COCOAPODS_TRUNK_TOKEN" >&2
            exit 1
          fi

          if [ -z "${COCOAPODS_TRUNK_EMAIL:-}" ]; then
            echo "Missing COCOAPODS_TRUNK_EMAIL" >&2
            exit 1
          fi

          cat > ~/.netrc <<EOF
          machine trunk.cocoapods.org
            login ${COCOAPODS_TRUNK_EMAIL}
            password ${COCOAPODS_TRUNK_TOKEN}
          EOF

          chmod 600 ~/.netrc

      - name: Validate CocoaPods trunk session
        run: |
          set -Eeuo pipefail
          pod trunk me

      - name: Validate CocoaPods spec
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/spm-repo"
          pod spec lint truvideo-sdk-core.podspec \
            --allow-warnings \
            --skip-import-validation \
            --verbose

      - name: Publish to CocoaPods
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/spm-repo"
          pod trunk push truvideo-sdk-core.podspec \
            --allow-warnings \
            --skip-import-validation \
            --verbose