name: Release

on:
  workflow_dispatch:
    inputs:
      cut:
        description: "Release type"
        type: choice
        options: [rc, prod]
        required: false

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'workflow_dispatch')
    runs-on: macos-15

    env:
      LBL_RC: cut-rc      
      GH_TOKEN: ${{ secrets.GH_EXTERNAL_PAT }}
      SPM_CLONE_DIR: ${{ github.workspace }}/.spm-checkouts

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git identity
        shell: bash
        run: |
          set -euo pipefail

          git config user.name  "truvideo[bot]"
          git config user.email "truvideo[bot]@users.noreply.github.com"

      - name: Install tooling
        run: |
          brew install jq xcodegen cocoapods || true
          python3 -m venv .venv

          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install gdown

          .venv/bin/gdown --version

      - name: Build CocoaPods artifact
        shell: bash
        env:
          COCOAPODS_UTILS_LINK: ${{ secrets.COCOAPODS_UTILS_LINK }}
        run: |
          set -Eeuo pipefail
          chmod +x scripts/build_cocoapods_artifact.sh
          scripts/build_cocoapods_artifact.sh
      
    